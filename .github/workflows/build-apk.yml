name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LandMeasure-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release with APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: LandMeasure v1.0.${{ github.run_number }}
          body: |
            📱 **LandMeasure APK** — Auto-generated build
            
            Download `app-debug.apk` di bawah lalu install di HP Android:
            1. Enable "Install from unknown sources" di Settings HP
            2. Tap file APK untuk install
            3. Buka LandMeasure & izinkan lokasi saat diminta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
